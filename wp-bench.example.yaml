# WP-Bench Configuration
# Copy to wp-bench.yaml and customize. API keys loaded from .env file.

dataset:
  source: local          # 'local' or 'huggingface'
  name: wp-core-v1       # suite name or HF dataset path

# Multiple models to benchmark (runs sequentially, outputs comparison table)
models:
  # OpenAI
  - name: gpt-4o
  - name: gpt-4o-mini
  # Google Gemini
  - name: gemini/gemini-2.5-pro
  - name: gemini/gemini-2.5-flash
  # Anthropic Claude
  - name: claude-sonnet-4-20250514
  - name: claude-opus-4-5-20251101

# Or use single model (legacy format):
# model:
#   name: gpt-4o

# WordPress runtime grader
grader:
  kind: docker
  wp_env_dir: ./runtime  # path to wp-env project
  # timeout_seconds: 90        # hard cap per runtime execution; a timed-out
  #                            # test scores 0.0 and is marked timeout: true
  # setup_timeout_seconds: 600 # hard cap for environment setup (wp-env start);
  #                            # setup timeout aborts the run with a clear error

# Run configuration
run:
  suite: wp-core-v1
  # limit: 10            # limit tests per model (null = all)
  # test_ids: []         # optional explicit test IDs to run
  # dry_run: false       # load/filter tests without calling models
  concurrency: 5         # model-call concurrency (knowledge tests)
  # Execution-test isolation. 'reset_per_test' (default) resets WordPress
  # to a clean baseline before every execution test and runs them serially.
  # 'none' opts out and allows execution_concurrency > 1, but tests then
  # share mutable WordPress state (not valid for official benchmark runs).
  # execution_isolation: reset_per_test
  # execution_concurrency: 1

# Output paths
output:
  path: output/results.json
  jsonl_path: output/results.jsonl
